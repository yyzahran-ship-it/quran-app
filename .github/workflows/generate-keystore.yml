name: Generate Upload Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore and print base64
        run: |
          keytool -genkey -v \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "QuranApp@2025#Secure" \
            -keypass  "QuranApp@2025#Secure" \
            -dname "CN=Quran App, OU=Mobile, O=Yazan, L=SA, ST=SA, C=SA"

          echo ""
          echo "========================================"
          echo "COPY EVERYTHING BETWEEN THE MARKERS BELOW"
          echo "Add it as GitHub Secret: KEYSTORE_BASE64"
          echo "========================================"
          base64 -w 0 upload-keystore.jks
          echo ""
          echo "========================================"
          echo "END OF KEYSTORE"
          echo "========================================"
